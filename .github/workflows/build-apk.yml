name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Save the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Unicast.apk
          gh release create "build-${{ github.run_number }}" Unicast.apk \
            --title "Unicast build ${{ github.run_number }}" \
            --notes "Debug build from commit ${{ github.sha }}. Download Unicast.apk on your phone to install."
